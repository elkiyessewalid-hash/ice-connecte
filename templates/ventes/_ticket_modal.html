{% comment %}Fragment de consultation d'un ticket (injecté dans #appModalContent).{% endcomment %}
<div class="modal-header">
    <h5 class="modal-title"><i class="fa-solid fa-receipt me-2"></i>Ticket {{ vente.code_vente }}</h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
</div>
<div class="modal-body">
    {% include "partials/_ticket.html" with vente=vente %}
</div>
<div class="modal-footer">
    <a href="{% url 'ventes:ticket' vente.pk %}" target="_blank" class="btn btn-sm btn-primary"><i class="fa-solid fa-print me-1"></i>Imprimer</a>
    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
</div>
