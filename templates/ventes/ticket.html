{% load static %}
<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket {{ vente.code_vente }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    <style>
        /* Deux exemplaires empilés sur une même page A4. */
        .ticket-sheet { max-width: 380px; margin: 0 auto; }
        .ticket-copy-label { text-align: center; font-size: .7rem; letter-spacing: .15em;
            text-transform: uppercase; color: #94a3b8; margin-bottom: .25rem; }
        .cut-line { text-align: center; color: #94a3b8; font-size: .75rem;
            letter-spacing: .35em; margin: 1.25rem 0; }
        @media print {
            @page { size: A4; margin: 12mm; }
            /* La feuille devient le conteneur imprimable ; ses deux tickets
               s'empilent en flux normal (on neutralise le positionnement absolu). */
            .ticket-sheet.printable { position: static; inset: auto; }
            .ticket-sheet .ticket { position: static; inset: auto; width: 100%;
                break-inside: avoid; }
            .cut-line { margin: 10mm 0; }
        }
    </style>
</head>
<body class="p-4 bg-light">
    <div class="text-center mb-3 no-print">
        <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print me-1"></i> Imprimer</button>
        <button class="btn btn-outline-secondary" onclick="window.close()">Fermer</button>
    </div>

    <div class="ticket-sheet printable">
        <div class="ticket-copy-label">Exemplaire 1 — Client</div>
        {% include "partials/_ticket.html" %}
        <div class="cut-line">✂ — — — — — — — — — — — — — — — —</div>
        <div class="ticket-copy-label">Exemplaire 2 — Souche</div>
        {% include "partials/_ticket.html" %}
    </div>
</body>
</html>
