{% comment %}
Ajoute un bouton œil (afficher/masquer) à chaque champ mot de passe de la page.
Autonome : ne dépend que de FontAwesome (déjà chargé) et de Bootstrap (.input-group).
{% endcomment %}
<script>
(function () {
    function enhance(input) {
        if (input.dataset.toggleReady) return;
        input.dataset.toggleReady = "1";
        var group = document.createElement("div");
        group.className = "input-group";
        input.parentNode.insertBefore(group, input);
        group.appendChild(input);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn-outline-secondary";
        btn.setAttribute("tabindex", "-1");
        btn.setAttribute("aria-label", "Afficher / masquer le mot de passe");
        btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
        btn.addEventListener("click", function () {
            var masque = input.type === "password";
            input.type = masque ? "text" : "password";
            btn.querySelector("i").className = masque ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
        });
        group.appendChild(btn);
    }
    function init() {
        document.querySelectorAll('input[type="password"]').forEach(enhance);
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
