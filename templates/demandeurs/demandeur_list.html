{% extends "base.html" %}

{% block title %}Demandeurs{% endblock %}
{% block page_title %}Gestion des demandeurs{% endblock %}

{% block content %}
<div class="content-card">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Demandeurs</h2>
        <div class="dropdown">
            <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fa-solid fa-plus me-1"></i> Nouveau demandeur
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'demandeurs:physique_create' %}"><i class="fa-solid fa-user me-2"></i>Personne physique</a></li>
                <li><a class="dropdown-item" href="{% url 'demandeurs:morale_create' %}"><i class="fa-solid fa-building me-2"></i>Personne morale</a></li>
            </ul>
        </div>
    </div>

    <form class="row g-2 align-items-end mb-3"
          hx-get="{% url 'demandeurs:list' %}"
          hx-target="#demandeur-results" hx-push-url="true"
          hx-trigger="submit, change, keyup changed delay:400ms">
        <div class="col-12 col-md-4">
            <label class="form-label small">Recherche</label>
            <input type="search" name="q" value="{{ filtres.q }}" class="form-control form-control-sm"
                   placeholder="Code, CIN, nom, prénom, raison sociale…" autocomplete="off">
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small">Type</label>
            <select name="categorie" class="form-select form-select-sm">
                <option value="">Tous</option>
                {% for value, label in categories %}
                    <option value="{{ value }}" {% if filtres.categorie == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label small">Statut</label>
            <select name="statut" class="form-select form-select-sm">
                <option value="">Tous</option>
                {% for value, label in statuts %}
                    <option value="{{ value }}" {% if filtres.statut == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-2">
            <label class="form-label small">État</label>
            <select name="etat" class="form-select form-select-sm">
                <option value="">Tous</option>
                <option value="actif" {% if filtres.etat == 'actif' %}selected{% endif %}>Actif</option>
                <option value="inactif" {% if filtres.etat == 'inactif' %}selected{% endif %}>Désactivé</option>
            </select>
        </div>
        <div class="col-6 col-md-1 d-grid">
            <button type="submit" class="btn btn-sm btn-primary"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </form>

    <div id="demandeur-results">
        {% include "demandeurs/_demandeur_table.html" %}
    </div>
</div>
{% endblock %}
